  <style>
    :root {
      color-scheme: light;
      --page-top: #17233d;
      --page-bottom: #0d1324;
      --panel: #f6f7fb;
      --panel-edge: rgba(255, 255, 255, .13);
      --ink: #202536;
      --muted: #697086;
      --ai: #fff;
      --user: #4263eb;
      --user-ink: #fff;
      --accent: #f05a47;
      --accent-dark: #d94736;
      --line: #dfe2ec;
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 18% 5%, rgba(65, 92, 153, .35), transparent 32rem),
        radial-gradient(circle at 86% 88%, rgba(48, 66, 116, .23), transparent 36rem),
        linear-gradient(145deg, var(--page-top), var(--page-bottom));
    }

    button, input { font: inherit; }

    button { color: inherit; }

    .app-shell {
      height: 100%;
      padding: 32px;
      display: grid;
      place-items: center;
    }

    .chat-window {
      width: min(1040px, 100%);
      height: min(900px, 100%);
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .chat-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px 14px 24px;
      background: rgba(255, 255, 255, .9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 4;
    }

    .title-wrap {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-mascot {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: block;
      object-fit: contain;
    }

    .title-copy { min-width: 0; }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: 18px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      transition: border-color .16s, transform .16s, background .16s;
    }

    .icon-button:hover { border-color: #aeb5c7; background: #fafbff; }
    .icon-button:active { transform: scale(.96); }
    .icon-button svg { width: 20px; height: 20px; }

    .search-bar {
      display: none;
      align-items: center;
      gap: 8px;
      position: absolute;
      inset: 0;
      padding: 12px 16px;
      background: rgba(255, 255, 255, .98);
    }

    .search-bar.open { display: flex; }

    .search-input {
      min-width: 0;
      flex: 1;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #b8bfd0;
      border-radius: 12px;
      outline: none;
      background: #fff;
    }

    .search-input:focus { border-color: var(--user); box-shadow: 0 0 0 3px rgba(66, 99, 235, .12); }

    .search-count {
      min-width: 64px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .conversation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-gutter: stable;
      padding: 30px clamp(24px, 5vw, 64px) 56px;
    }

    .empty-state {
      height: 100%;
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .drop-card {
      width: min(540px, 100%);
      padding: 52px 36px;
      text-align: center;
      border: 2px dashed #c9cedb;
      border-radius: 22px;
      background: rgba(255, 255, 255, .68);
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }

    .drop-card:hover,
    .drop-card.dragging {
      border-color: var(--accent);
      background: #fff;
      transform: translateY(-2px);
    }

    .drop-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      color: #fff;
      border-radius: 20px;
      background: linear-gradient(145deg, #fb765f, var(--accent));
      box-shadow: 0 14px 30px rgba(240, 90, 71, .25);
    }

    .drop-icon svg { width: 34px; height: 34px; }
    .drop-card h2 { margin: 0 0 10px; font-size: 22px; }
    .drop-card p { margin: 0; color: var(--muted); line-height: 1.7; }

    .browse-label {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 18px;
      color: #fff;
      font-size: 14px;
      font-weight: 750;
      border-radius: 11px;
      background: var(--ink);
    }

    .privacy-note { margin-top: 16px !important; font-size: 12px; }

    .error-message {
      max-width: 540px;
      margin: 0 auto 18px;
      padding: 12px 14px;
      color: #9f261e;
      line-height: 1.55;
      border: 1px solid #f2bbb4;
      border-radius: 11px;
      background: #fff0ee;
    }

    .message-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 13px;
      align-items: start;
      margin: 0 0 26px;
      scroll-margin-top: 24px;
    }

    .message-row.user {
      grid-template-columns: minmax(0, 1fr) 48px;
    }

    .message-row.user .avatar { grid-column: 2; }
    .message-row.user .message-stack { grid-column: 1; grid-row: 1; align-items: flex-end; }

    .avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex: none;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #d9dce6;
      box-shadow: 0 4px 14px rgba(24, 29, 44, .14);
    }

    .avatar img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .avatar.user-avatar { color: #737b90; background: #e5e7ee; }
    .avatar.user-avatar svg { width: 27px; height: 27px; }

    .message-stack {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .speaker {
      margin: 0 3px 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .bubble {
      max-width: min(760px, 88%);
      padding: 14px 17px;
      line-height: 1.68;
      border: 1px solid #e3e5ed;
      border-radius: 6px 18px 18px 18px;
      background: var(--ai);
      box-shadow: 0 5px 18px rgba(25, 30, 45, .07);
      overflow-wrap: anywhere;
    }

    .user .bubble {
      color: var(--user-ink);
      border-color: transparent;
      border-radius: 18px 6px 18px 18px;
      background: linear-gradient(145deg, #5374f5, var(--user));
      box-shadow: 0 7px 20px rgba(66, 99, 235, .22);
    }

    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble p { margin: 0 0 .85em; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 1.15em 0 .45em; line-height: 1.35; white-space: normal; }
    .bubble h1 { font-size: 1.35em; }
    .bubble h2 { font-size: 1.22em; }
    .bubble h3 { font-size: 1.1em; }
    .bubble ul, .bubble ol { margin: .45em 0 .9em; padding-left: 1.45em; }
    .bubble li + li { margin-top: .28em; }
    .bubble blockquote { margin: .8em 0; padding: .15em 0 .15em 1em; color: #555d73; border-left: 3px solid #cbd0dd; }
    .user .bubble blockquote { color: rgba(255,255,255,.83); border-left-color: rgba(255,255,255,.45); }
    .bubble a { color: #294cca; text-underline-offset: 2px; }
    .user .bubble a { color: #fff; }
    .bubble code:not(pre code) { padding: .12em .36em; border-radius: 5px; background: #eef0f5; font: .88em ui-monospace, SFMono-Regular, Consolas, monospace; }
    .user .bubble code:not(pre code) { background: rgba(18, 31, 87, .28); }

    .code-wrap {
      margin: .9em 0;
      overflow: hidden;
      border: 1px solid #2d3448;
      border-radius: 11px;
      background: #171b27;
    }

    .code-label {
      padding: 7px 12px;
      color: #aab2c8;
      font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
      border-bottom: 1px solid #2d3448;
      background: #202535;
    }

    pre { margin: 0; padding: 14px; overflow-x: auto; color: #e8eaf1; line-height: 1.55; }
    pre code { font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre; }

    .question-card { padding-bottom: 16px; }
    .question-card + .question-card { margin-top: 17px; padding-top: 17px; border-top: 1px solid var(--line); }
    .question-header { margin-bottom: 5px; color: var(--accent-dark); font-size: 11px; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; }
    .question-text { font-weight: 680; }
    .question-options { display: grid; gap: 7px; margin-top: 11px; }
    .question-option { padding: 8px 10px; border: 1px solid #dfe2ea; border-radius: 9px; background: #f8f9fc; }
    .option-label { font-size: 13px; font-weight: 720; }
    .option-description { margin-top: 2px; color: var(--muted); font-size: 12px; }

    mark.search-hit { padding: 0 2px; color: inherit; border-radius: 3px; background: #ffe16b; }
    mark.search-hit.current { outline: 2px solid #ef9e28; background: #ffc83d; }
    .user mark.search-hit { color: #202536; }

    .file-input { display: none; }

    .drag-overlay {
      position: fixed;
      inset: 18px;
      z-index: 20;
      display: none;
      place-items: center;
      color: #fff;
      font-size: 20px;
      font-weight: 780;
      border: 3px dashed rgba(255,255,255,.8);
      border-radius: 26px;
      background: rgba(16, 24, 44, .84);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .drag-overlay.visible { display: grid; }

    .loading {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 13px;
      border: 3px solid #d9dce6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .app-shell { min-width: 720px; place-items: stretch; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="chat-window" aria-label="Claude Session 閱讀器">
      <header class="chat-header">
        <div class="title-wrap">
          <img class="title-mascot" id="titleMascot" alt="" aria-hidden="true">
          <div class="title-copy">
            <p class="eyebrow">Claude session</p>
            <h1 id="sessionTitle">對話閱讀器</h1>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="searchButton" type="button" aria-label="搜尋對話" title="搜尋對話" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          </button>
          <button class="icon-button" id="openButton" type="button" aria-label="開啟另一份 session" title="開啟另一份 session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7.5h6l2 2h10v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path><path d="M3 8V5a2 2 0 0 1 2-2h4l2 2h6"></path></svg>
          </button>
        </div>
        <div class="search-bar" id="searchBar">
          <input class="search-input" id="searchInput" type="search" placeholder="搜尋對話內容…" autocomplete="off">
          <span class="search-count" id="searchCount">0 / 0</span>
          <button class="icon-button" id="previousMatch" type="button" aria-label="上一筆搜尋結果" title="上一筆">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"></path></svg>
          </button>
          <button class="icon-button" id="nextMatch" type="button" aria-label="下一筆搜尋結果" title="下一筆">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <button class="icon-button" id="closeSearch" type="button" aria-label="關閉搜尋" title="關閉">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
      </header>

      <div class="conversation" id="conversation">
        <div class="empty-state" id="emptyState">
          <div class="drop-card" id="dropCard" role="button" tabindex="0" aria-label="選擇或拖曳 Claude session JSONL 檔案">
            <div class="drop-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
            </div>
            <h2>拖曳 Claude session 到這裡</h2>
            <p>支援 Claude Code 的 <strong>.jsonl</strong> session 檔案</p>
            <span class="browse-label">選擇檔案</span>
            <p class="privacy-note">所有內容只在這個瀏覽器頁面內處理，不會上傳。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="drag-overlay" id="dragOverlay">放開以閱讀這份 session</div>
  <input class="file-input" id="fileInput" type="file" accept=".jsonl,application/json">

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      }

      function safeUrl(value) {
        const url = String(value ?? '').trim();
        return /^(https?:|mailto:)/i.test(url) ? escapeHtml(url) : '#';
      }

          codeTokens.push(`<code>${code}</code>`);
          return token;
        });

        value = value
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => `<a href="${safeUrl(href)}" target="_blank" rel="noreferrer">${label}</a>`)
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_]+)__/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
          .replace(/~~([^~]+)~~/g, '<del>$1</del>');

        return value.replace(/\u0000CODE(\d+)\u0000/g, (_, index) => codeTokens[Number(index)]);
      }

      function renderMarkdown(raw) {
        const lines = String(raw ?? '').replace(/\r\n?/g, '\n').split('\n');
        const html = [];
        let paragraph = [];
        let listType = null;
        let inCode = false;
        let codeLanguage = '';
        let codeLines = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          html.push(`<p>${paragraph.map(renderInline).join('<br>')}</p>`);
          paragraph = [];
        };

        const closeList = () => {
          if (!listType) return;
          html.push(`</${listType}>`);
          listType = null;
        };

        const flushCode = () => {
          const label = codeLanguage ? `<div class="code-label">${escapeHtml(codeLanguage)}</div>` : '';
          html.push(`<div class="code-wrap">${label}<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre></div>`);
          codeLines = [];
          codeLanguage = '';
        };

        for (const line of lines) {
          const fence = line.match(/^\s*```\s*([^`]*)$/);
          if (fence) {
            if (inCode) {
              flushCode();
              inCode = false;
            } else {
              flushParagraph();
              closeList();
              inCode = true;
              codeLanguage = fence[1].trim();
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            const level = heading[1].length;
            html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
            continue;
          }

          const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (unordered || ordered) {
            flushParagraph();
            const desired = unordered ? 'ul' : 'ol';
            if (listType !== desired) {
              closeList();
              html.push(`<${desired}>`);
              listType = desired;
            }
            html.push(`<li>${renderInline((unordered || ordered)[1])}</li>`);
            continue;
          }

          const quote = line.match(/^>\s?(.*)$/);
          if (quote) {
            flushParagraph();
            closeList();
            html.push(`<blockquote>${renderInline(quote[1])}</blockquote>`);
            continue;
          }

          if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)) {
            flushParagraph();
            closeList();
            html.push('<hr>');
            continue;
          }

          paragraph.push(line);
        }

        if (inCode) flushCode();
        flushParagraph();
        closeList();
        return html.join('');
      }

      function textFromContent(content) {
        if (typeof content === 'string') return content;
        if (!Array.isArray(content)) return '';
        return content
          .filter(block => block && block.type === 'text' && typeof block.text === 'string')
          .map(block => block.text)
          .join('\n\n');
      }

      function humanText(record) {
        const text = textFromContent(record?.message?.content).trim();
        if (!text) return '';

        const commandArgs = text.match(/<command-args>([\s\S]*?)<\/command-args>/i);
        if (commandArgs) return commandArgs[1].trim();

        if (/^<(?:local-command-stdout|command-name|command-message)(?:\s|>)/i.test(text)) return '';
        return text;
      }

      function isHumanMessage(record) {
        if (!record || record.type !== 'user' || record.isSidechain === true) return false;
        if (record.isMeta === true || record.toolUseResult != null) return false;
        if (record.origin?.kind === 'task-notification' || record.promptSource === 'system') return false;
        const content = record.message?.content;
        if (Array.isArray(content) && content.some(block => block?.type === 'tool_result')) return false;
        return Boolean(humanText(record));
      }

      function parseQuotedAnswers(content) {
        const answers = [];
        const regex = /"((?:\\.|[^"\\])*)"\s*=\s*"((?:\\.|[^"\\])*)"/g;
        let match;
        while ((match = regex.exec(String(content ?? '')))) {
          const decode = value => {
            try { return JSON.parse(`"${value}"`); }
            catch { return value.replaceAll('\\"', '"').replaceAll('\\n', '\n'); }
          };
          answers.push({ question: decode(match[1]), answer: decode(match[2]) });
        }
        return answers;
      }

      function parseSession(source, filename) {
        const records = [];
        let invalidLines = 0;

        for (const line of source.split(/\r?\n/)) {
          if (!line.trim()) continue;
          try { records.push(JSON.parse(line)); }
          catch { invalidLines += 1; }
        }

        if (!records.length) throw new Error('找不到可讀取的 JSONL 紀錄。');

        const messages = [];
        const askById = new Map();
        let title = '';

        for (const record of records) {
          if (record?.type === 'ai-title' && typeof record.aiTitle === 'string' && record.aiTitle.trim()) {
            title = record.aiTitle.trim();
            continue;
          }

          if (record?.isSidechain === true) continue;

          if (record?.type === 'assistant' && Array.isArray(record.message?.content)) {
            for (const block of record.message.content) {
              if (block?.type === 'text' && record.message.stop_reason === 'end_turn' && typeof block.text === 'string') {
                const text = block.text.trim();
                if (text) messages.push({ role: 'assistant', kind: 'text', text });
              } else if (block?.type === 'tool_use' && block.name === 'AskUserQuestion') {
                const questions = Array.isArray(block.input?.questions) ? block.input.questions : [];
                const message = { role: 'assistant', kind: 'question', questions, toolUseId: block.id };
                messages.push(message);
                if (block.id) askById.set(block.id, message);
              }
            }
            continue;
          }

          if (record?.type === 'user' && Array.isArray(record.message?.content)) {
            const askResults = record.message.content.filter(block => block?.type === 'tool_result' && askById.has(block.tool_use_id));
            if (askResults.length) {
              for (const result of askResults) {
                const answers = parseQuotedAnswers(result.content);
                const fallback = typeof result.content === 'string' ? result.content.trim() : '';
                messages.push({
                  role: 'user',
                  kind: 'answer',
                  text: answers.length ? answers.map(item => item.answer).join('\n') : fallback
                });
              }
              continue;
            }
          }

          if (isHumanMessage(record)) {
            messages.push({ role: 'user', kind: 'text', text: humanText(record) });
          }
        }

        if (!messages.length) throw new Error('這份檔案中沒有可顯示的對話內容。');

        return {
          title: title || filename.replace(/\.jsonl$/i, '') || '未命名對話',
          messages,
          invalidLines
        };
      }

      function assistantAvatar() {
        return `<div class="avatar"><img src="${CLAWD_AVATAR}" alt="Claude"></div>`;
      }

      function userAvatar() {
        return `<div class="avatar user-avatar" aria-label="使用者頭像佔位"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg></div>`;
      }

      function renderQuestion(message) {
        return message.questions.map(question => {
          const options = Array.isArray(question.options) && question.options.length
            ? `<div class="question-options">${question.options.map(option => `
                <div class="question-option">
                  <div class="option-label">${escapeHtml(option.label ?? '')}</div>
                  ${option.description ? `<div class="option-description">${escapeHtml(option.description)}</div>` : ''}
                </div>`).join('')}</div>`
            : '';
          return `<div class="question-card">
            ${question.header ? `<div class="question-header">${escapeHtml(question.header)}</div>` : ''}
            <div class="question-text">${renderInline(question.question ?? '')}</div>
            ${options}
          </div>`;
        }).join('');
      }

      function renderConversation() {
        elements.conversation.innerHTML = state.messages.map((message, index) => {
          const isUser = message.role === 'user';
          const content = message.kind === 'question' ? renderQuestion(message) : renderMarkdown(message.text);
          return `<article class="message-row ${isUser ? 'user' : 'assistant'}" data-message-index="${index}">
            ${isUser ? userAvatar() : assistantAvatar()}
            <div class="message-stack">
              <div class="speaker">${isUser ? '使用者' : 'Claude'}</div>
              <div class="bubble">${content}</div>
            </div>
          </article>`;
        }).join('');
        elements.conversation.scrollTop = 0;
      }

      function showError(message) {
        elements.conversation.innerHTML = `
          <div class="empty-state">
            <div>
              <div class="error-message" role="alert">${escapeHtml(message)}</div>
              <div class="drop-card" id="retryDropCard" role="button" tabindex="0">
                <h2>請選擇另一份檔案</h2>
                <p>拖曳或點擊以重新選擇 Claude session JSONL。</p>
              </div>
            </div>
          </div>`;
        const retry = document.getElementById('retryDropCard');
        retry.addEventListener('click', openPicker);
        retry.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') openPicker();
        });
        elements.searchButton.hidden = true;
      }

      async function loadFile(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.jsonl')) {
          showError('請選擇副檔名為 .jsonl 的 Claude session 檔案。');
          return;
        }

        elements.conversation.innerHTML = '<div class="loading"><div><div class="spinner"></div>正在整理對話…</div></div>';
        closeSearch();
        await new Promise(resolve => requestAnimationFrame(resolve));

        try {
          const source = await file.text();
          const parsed = parseSession(source, file.name);
          state.messages = parsed.messages;
          state.title = parsed.title;
          state.filename = file.name;
          elements.sessionTitle.textContent = parsed.title;
          document.title = `${parsed.title} · Claude Session Reader`;
          renderConversation();
          elements.searchButton.hidden = false;
        } catch (error) {
          showError(error instanceof Error ? error.message : '無法讀取這份 session。');
        } finally {
          elements.fileInput.value = '';
        }
      }

      function clearSearchHighlights() {
        for (const mark of elements.conversation.querySelectorAll('mark.search-hit')) {
          mark.replaceWith(document.createTextNode(mark.textContent));
        }
        elements.conversation.normalize();
        state.matches = [];
        state.matchIndex = -1;
      }

      function updateSearchCount() {
        elements.searchCount.textContent = state.matches.length
          ? `${state.matchIndex + 1} / ${state.matches.length}`
          : '0 / 0';
      }

      function runSearch() {
        clearSearchHighlights();
        const query = elements.searchInput.value.trim();
        if (!query) {
          updateSearchCount();
          return;
        }

        const normalizedQuery = query.toLocaleLowerCase();
        const walker = document.createTreeWalker(elements.conversation, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (!node.nodeValue?.toLocaleLowerCase().includes(normalizedQuery)) return NodeFilter.FILTER_REJECT;
            if (node.parentElement?.closest('script, style')) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });

        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        for (const node of nodes) {
          const text = node.nodeValue;
          const lower = text.toLocaleLowerCase();
          const fragment = document.createDocumentFragment();
          let cursor = 0;
          let index = lower.indexOf(normalizedQuery);
          while (index !== -1) {
            fragment.append(document.createTextNode(text.slice(cursor, index)));
            const mark = document.createElement('mark');
            mark.className = 'search-hit';
            mark.textContent = text.slice(index, index + query.length);
            fragment.append(mark);
            state.matches.push(mark);
            cursor = index + query.length;
            index = lower.indexOf(normalizedQuery, cursor);
          }
          fragment.append(document.createTextNode(text.slice(cursor)));
          node.replaceWith(fragment);
        }

        if (state.matches.length) {
          state.matchIndex = 0;
          focusMatch(0);
        } else {
          updateSearchCount();
        }
      }

      function focusMatch(index) {
        if (!state.matches.length) return;
        state.matches.forEach(mark => mark.classList.remove('current'));
        state.matchIndex = (index + state.matches.length) % state.matches.length;
        const current = state.matches[state.matchIndex];
        current.classList.add('current');
        current.scrollIntoView({ block: 'center', behavior: 'smooth' });
        updateSearchCount();
      }

      function openSearch() {
        elements.searchBar.classList.add('open');
        elements.searchInput.focus();
      }

      function closeSearch() {
        elements.searchBar.classList.remove('open');
        elements.searchInput.value = '';
        clearSearchHighlights();
        updateSearchCount();
      }

      function openPicker() { elements.fileInput.click(); }

      let dragDepth = 0;
      window.addEventListener('dragenter', event => {
        if (!event.dataTransfer?.types?.includes('Files')) return;
        event.preventDefault();
        dragDepth += 1;
        elements.dragOverlay.classList.add('visible');
        elements.dropCard?.classList.add('dragging');
      });
      window.addEventListener('dragover', event => {
        if (event.dataTransfer?.types?.includes('Files')) event.preventDefault();
      });
      window.addEventListener('dragleave', event => {
        if (!event.dataTransfer?.types?.includes('Files')) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) {
          elements.dragOverlay.classList.remove('visible');
          elements.dropCard?.classList.remove('dragging');
        }
      });
      window.addEventListener('drop', event => {
        event.preventDefault();
        dragDepth = 0;
        elements.dragOverlay.classList.remove('visible');
        elements.dropCard?.classList.remove('dragging');
        loadFile(event.dataTransfer?.files?.[0]);
      });

      elements.dropCard.addEventListener('click', openPicker);
      elements.dropCard.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openPicker();
        }
      });
      elements.openButton.addEventListener('click', openPicker);
      elements.fileInput.addEventListener('change', () => loadFile(elements.fileInput.files?.[0]));
      elements.searchButton.addEventListener('click', openSearch);
      elements.closeSearch.addEventListener('click', closeSearch);
      elements.previousMatch.addEventListener('click', () => focusMatch(state.matchIndex - 1));
      elements.nextMatch.addEventListener('click', () => focusMatch(state.matchIndex + 1));
      elements.searchInput.addEventListener('input', runSearch);
      elements.searchInput.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeSearch();
        if (event.key === 'Enter') {
          event.preventDefault();
          focusMatch(state.matchIndex + (event.shiftKey ? -1 : 1));
        }
      });
      window.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'f' && state.messages.length) {
          event.preventDefault();
          openSearch();
        }
      });
    })();
  </script>
</body>
</html>
